name: testpypi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check synchronized licenses
        run: python tools/check_licenses.py
      - name: Check synchronized versions
        run: python tools/check_versions.py
      - name: Check project naming
        run: python tools/check_branding.py
      - name: Check publisher identity and URLs
        run: python tools/check_release_readiness.py
      - name: Build distributions
        run: python -m build packages/python --outdir dist
      - name: Check distributions
        run: |
          python -m twine check --strict dist/*
          python tools/check_python_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/shadcn-qt/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ vars.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
