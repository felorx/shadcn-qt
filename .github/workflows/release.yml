name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install build and test dependencies
        run: python -m pip install --upgrade build twine "./packages/python[pyside6,dev]"
      - name: Check synchronized licenses
        run: python tools/check_licenses.py
      - name: Check synchronized versions
        run: python tools/check_versions.py
      - name: Check project naming
        run: python tools/check_branding.py
      - name: Check publisher identity and URLs
        run: python tools/check_release_readiness.py
      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: packages/python
        run: python -m pytest packages/python/tests -q
      - name: Build distributions
        run: python -m build packages/python --outdir dist
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      - name: Check distribution contents and tag
        run: python tools/check_python_dist.py dist --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shadcn-qt/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ vars.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_API_TOKEN }}
