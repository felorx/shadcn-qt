name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.9"
      - name: Ruff (package and tests)
        working-directory: packages/python
        run: ruff check .
      - name: Ruff (tools and gallery)
        run: ruff check --config packages/python/pyproject.toml tools examples

  artifacts:
    name: generated artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate artifacts
        run: python tools/token-codegen/generate.py
      - name: Fail when regeneration changes tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            echo "::error::generated artifacts are stale; run python tools/token-codegen/generate.py"
            exit 1
          fi

  checks:
    name: checks python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regenerate artifacts
        run: python tools/token-codegen/generate.py
      - name: Check synchronized licenses
        run: python tools/check_licenses.py
      - name: Check synchronized versions
        run: python tools/check_versions.py
      - name: Check project naming
        run: python tools/check_branding.py
      - name: Check Core and Pro repository boundary
        run: python tools/check_core_boundary.py
      - name: Install package and test tools (no Qt binding)
        run: pip install -e "./packages/python[dev]"
      - name: Unit tests without a Qt binding
        env:
          PYTHONPATH: packages/python
        run: python -m pytest packages/python/tests -q

  # PyQt5 is intentionally absent: Qt 5.15 crashes with an access violation when
  # the offscreen plugin shows a QMessageBox, which a bare PyQt5 script
  # reproduces without any shadcn-qt code.  See docs/STATUS.md for the manual
  # PyQt5 check that replaces this job.
  qt:
    name: qt ${{ matrix.qt-binding }} python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt-binding: PySide6
            extra: pyside6
            python-version: "3.11"
          - qt-binding: PyQt6
            extra: pyqt6
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 fonts-dejavu-core
      - name: Install binding and test tools
        run: pip install -e "./packages/python[${{ matrix.extra }},dev]"
      - name: Unit tests
        env:
          PYTHONPATH: packages/python
          QT_QPA_PLATFORM: offscreen
          SHADCN_QT_BINDING: ${{ matrix.qt-binding }}
        run: python -m pytest packages/python/tests -q

  windows:
    name: windows python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PySide6 and test tools
        run: pip install -e "./packages/python[pyside6,dev]"
      - name: Unit tests
        env:
          PYTHONPATH: packages/python
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest packages/python/tests -q

  package:
    name: package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: pip install --upgrade build twine
      - name: Build distributions
        working-directory: packages/python
        run: python -m build
      - name: Validate distributions
        run: python tools/check_python_dist.py packages/python/dist
      - name: Twine metadata check
        run: twine check --strict packages/python/dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build VitePress
        working-directory: apps/docs
        run: |
          npm ci
          npm run build
