[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadcn-qt"
version = "0.2.6"
description = "shadcn-aligned Qt widgets and design tokens for PySide and PyQt"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only OR LicenseRef-Shadcn-Qt-Commercial"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICE.md"]
authors = [{ name = "Felorx" }]
keywords = ["qt", "pyside", "pyqt", "shadcn", "qss", "widgets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: User Interfaces",
]

dependencies = []

[project.optional-dependencies]
pyside6 = ["PySide6>=6.5.0"]
pyqt6 = ["PyQt6>=6.5.0"]
pyside2 = ["PySide2>=5.15.0"]
pyqt5 = ["PyQt5>=5.15.0"]
dev = ["pytest>=7.0", "ruff>=0.9"]
designer = ["PySide6>=6.5.0"]

[project.scripts]
shadcn-qt-designer = "shadcn_qt.designer.launcher:main"

[project.urls]
Homepage = "https://felorx.com"
Source = "https://github.com/felorx/shadcn-qt"
Issues = "https://github.com/felorx/shadcn-qt/issues"
Documentation = "https://felorx.github.io/shadcn-qt/"
Commercial = "https://felorx.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadcn_qt*"]

[tool.setuptools.package-data]
shadcn_qt = ["_generated/*.qss", "_generated/*.py"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["shadcn_qt/_generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"shadcn_qt/_qt.py" = ["F822"]
